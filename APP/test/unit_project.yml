---
# APP unit tests: one APP module compiled by Ceedling itself (so it is instrumented for coverage) with its
# dependencies stubbed by hand in the test. Tests are in unit_tests/, the common modules' in xCOMMON_MODULES/test.
# Run from this folder:  ceedling --project=unit_project.yml gcov:test_<name>.c   (or  make test_<name>.test  in APP)
# The software tests (sw_test_project.yml) build into build/, these into build/unit/, so neither clobbers the other
:project:
  :which_ceedling: gem
  :ceedling_version: 1.0.1
  :use_mocks: FALSE                 # hand-written stubs, see xCOMMON_MODULES/test/TEST_STYLE_GUIDE.md
  :use_test_preprocessor: :none
  :use_deep_preprocessor: :none
  :use_backtrace: :simple
  :use_decorators: :auto
  :build_root: build/unit
  :test_file_prefix: test_
  :default_tasks:
    - test:all
  :test_threads: 8
  :compile_threads: 8
  :release_build: FALSE

:mixins:
  :enabled: []
  :load_paths: []

:test_build:
  :use_assembly: FALSE

:plugins:
  :load_paths: []
  :enabled:
    - gcov
    - report_tests_pretty_stdout

:extension:
  :executable: .out

# A test gets the .c of each header it includes from :source:, so a module's .c is built (and instrumented) when
# its test includes the header. The folders are those of the software tests' library (sw_test_project.yml :include:)
:paths:
  :test:
    - +:unit_tests/**
  :source:
    - ../Src/**
    - ../../Common_Src/**
    - ../../xCOMMON_MODULES/Src/**
    - ../../xCOMMON_MODULES/cfg
  :include:
    - ../Src/**
    - ../../Common_Src/**
    - ../../xCOMMON_MODULES/Src/**
    - ../../xCOMMON_MODULES/cfg
    - ../../xCOMMON_MODULES/test/support/VHW_STM32F10X

# TEST makes STATIC expand to nothing, so a test can reach a module's private state with extern
:defines:
  :test:
    :*:
      - TEST
    # TYRE_DATA reads DATASET0 between two linker symbols. The test points them at a payload it builds in RAM:
    # the symbols become what two pointers point at, so &symbol is the pointer's value
    :test_TYRE_DATA:
      - __dataset0_code_start__=(*test_dataset0_start_p)
      - __dataset0_code_end__=(*test_dataset0_end_p)
  :release: []
  :use_test_definition: FALSE

# -m32: a 32-bit host build everywhere (the 32-bit MinGW on Windows, gcc-multilib on CI), as the other test projects
:flags:
  :test:
    :compile:
      - -m32
      - -O0
      - -g
      - -Wno-incompatible-pointer-types
    :link:
      - -m32
  :gcov:
    :compile:
      - -m32
      - -g
      - -fprofile-arcs
      - -ftest-coverage
      - -Wno-incompatible-pointer-types

:unity:
  :defines:
    - UNITY_EXCLUDE_FLOAT

:gcov:
  :summaries: TRUE
  :report_task: FALSE
  :utilities:
    - gcovr
  :reports:
    - HtmlBasic
  :gcovr:
    :html_title: Test Coverage Report
    :html_medium_threshold: 75
    :html_high_threshold: 90

# The 32-bit MinGW first on the PATH on Windows (TTLD); on CI TTLD is unset and the system gcc with gcc-multilib is used
:environment:
  - :path:
    - "#{ENV['TTLD']}/MinGW/mingw32_v15.2/bin"
    - "#{ENV['PATH']}"

:tools:
  :test_compiler:
    :executable: gcc
    :name: GCC
    :optional: FALSE
  :test_linker:
    :executable: gcc
    :name: GCC
    :optional: FALSE
...
