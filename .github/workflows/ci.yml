# HUB CI, three jobs that run side by side:
#   build        every hardware variant (make -C APP all builds SUPER_PILL and BLUE_PILL, each with its own BM and FBL),
#                then the function documentation and the badges
#   unit_tests   make -C APP test_unit_all: all the unit tests, the common modules' (xCOMMON_MODULES/test/unit_tests)
#   sw_tests     make -C APP test_sw_all: all the software tests, HUB's own end to end tests (APP/test/sw_tests)
#
# This is the whole workflow in the repo, like AUTOCFG_HUB and Sleepy_sensor. The shared version in the build_env repo
# (.github/workflows/embedded-ci.yml) is a private repo's workflow, which a public repo such as HUB cannot call.
#
# All three gate the run, and a release needs all three. The function docs and the badges are reported but do not fail it.
name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - 'Tool_cfg/**'
      - 'scripts/**'
      - '.github/badges/**'
  pull_request:
  workflow_dispatch:
    inputs:
      manual_release:
        description: 'Create a release from this branch?'
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUILD_DIR: APP
  CI_BUILD_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - uses: ./.github/actions/setup

      # The secure boot HMAC secret is gitignored, so a fresh clone has none: the images are signed with the HMAC_SECRET
      # repository secret.
      - name: Provide the secure boot HMAC secret
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: printf '%s' "$HMAC_SECRET" > Tool_cfg/SigningKeys/hmac_secret.txt

      - name: Build every variant
        run: make -C "$BUILD_DIR" all

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: |
            APP/Build/**/*.hex
            APP/Build/**/*.elf
            APP/Build/**/*.map
            APP/Build/**/*.flashpack
            BM/Build/**/*.hex
            FBL/Build/**/*.hex
          if-no-files-found: warn
          retention-days: 60

      - name: Generate function documentation
        if: always()
        continue-on-error: true
        run: |
          make -C "$BUILD_DIR" doc_functions
          mkdir -p function_docs
          find APP/Src Common_Src xCOMMON_MODULES/Src -name '*_Documentation.html' -exec cp {} function_docs/ \; 2>/dev/null || true
          echo "Collected $(ls function_docs/*.html 2>/dev/null | wc -l) doc files"

      - name: Upload function documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: function-documentation-${{ github.sha }}
          path: function_docs/
          if-no-files-found: ignore
          retention-days: 60

      - name: Generate and commit badges
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}   # --commit pushes with this, not the read-only submodule token checkout left
        run: |
          badge=BuildEnv/xBuildEnv/bin/badge_creator
          ruby $badge --version-badge --yml "$BUILD_DIR/project.yml" --output .github/badges/version.svg
          ruby $badge --build-badge APP/Build/SUPER_PILL/APP.elf --output .github/badges/build.svg
          ruby $badge --commit .github/badges --also README.md   # the build writes the memory tables into the README

  # All the unit tests. They are the common modules' and run on the 32-bit host build in xCOMMON_MODULES/test/project.yml.
  # No firmware build and no signing secret: they need only the host compiler.
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      # gcc-multilib: the unit tests are a 32-bit host build (-m32 in xCOMMON_MODULES/test/project.yml)
      - uses: ./.github/actions/setup
        with:
          extra_apt: gcc-multilib

      - name: Run unit tests
        run: make -C "$BUILD_DIR" test_unit_all

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            xCOMMON_MODULES/test/build/artifacts/
            xCOMMON_MODULES/test/CodeCoverage/
            APP/test/build/unit/artifacts/
            APP/test/CodeCoverage/
          if-no-files-found: ignore
          retention-days: 60

  # All the software tests: HUB's own end to end tests (APP/test/sw_tests), run against the x86 build of the APP and
  # the common modules. No firmware build and no signing secret: they need only the host compiler.
  sw_tests:
    name: Software tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      # gcc-multilib: the software tests are a 32-bit host build (-m32 in sw_test_project.yml)
      - uses: ./.github/actions/setup
        with:
          extra_apt: gcc-multilib

      - name: Run software tests
        run: make -C "$BUILD_DIR" test_sw_all

      - name: Upload software test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-test-reports-${{ github.sha }}
          path: |
            APP/test/build/artifacts/
            APP/test/CodeCoverage/
          if-no-files-found: ignore
          retention-days: 60

  release_package:
    needs: [build, unit_tests, sw_tests]
    if: github.event_name == 'workflow_dispatch' && inputs.manual_release == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - uses: ./.github/actions/setup

      - name: Provide the secure boot HMAC secret
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          # A release is flashed to devices, so it is never built with a throwaway key
          if [ -z "$HMAC_SECRET" ]; then echo "::error::HMAC_SECRET is not set - refusing to release images signed with a throwaway key"; exit 1; fi
          printf '%s' "$HMAC_SECRET" > Tool_cfg/SigningKeys/hmac_secret.txt

      - name: Build release package
        env:
          CI_IS_RC: "true"
        run: make -C "$BUILD_DIR" release_package

      - name: Read version
        id: version
        env:
          CI_IS_RC: "true"
        run: |
          VER=$(cd "$BUILD_DIR" && sVersion -l --yml project.yml 2>/dev/null || echo "0.0.0.$(echo '${{ github.sha }}' | cut -c1-7)")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}"    >> "$GITHUB_OUTPUT"

      - name: Locate release ZIP
        id: zip
        run: |
          ZIP_PATH=$(find Release_package -name "*.zip" | head -1)
          echo "path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          ls -lh "${ZIP_PATH}"

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: release_assets/

      - name: Add release ZIP to assets
        run: cp "${{ steps.zip.outputs.path }}" release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "HUB ${{ steps.version.outputs.version }}"
          body: |
            **Branch:** `${{ github.ref_name }}` | **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'RC') }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
