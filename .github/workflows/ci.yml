# HUB CI: builds every hardware variant (make -C APP all builds SUPER_PILL and BLUE_PILL, each with its own BM and FBL),
# runs the unit and software tests, builds the function documentation and commits the badges.
#
# This is the whole workflow in the repo, like AUTOCFG_HUB and Sleepy_sensor. The shared version in the build_env repo
# (.github/workflows/embedded-ci.yml) is a private repo's workflow, which a public repo such as HUB cannot call.
#
# The build and the software tests gate the run. The function docs and the badges are reported but do not fail it.
name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'Docs/**'
      - 'Tool_cfg/**'
      - 'scripts/**'
      - '.github/badges/**'
  pull_request:
  workflow_dispatch:
    inputs:
      manual_release:
        description: 'Create a release from this branch?'
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUILD_DIR: APP

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - uses: ./.github/actions/setup

      # The secure boot HMAC secret is gitignored, so a fresh clone has none. With the HMAC_SECRET repository secret the
      # images are signed with the real key. Without it a throwaway key is made: the build and tests still run, but the
      # signed images are only good for checking the build - they will not boot on a device provisioned with the real key.
      - name: Provide the secure boot HMAC secret
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          mkdir -p Tool_cfg/SigningKeys
          if [ -n "$HMAC_SECRET" ]; then
            printf '%s' "$HMAC_SECRET" > Tool_cfg/SigningKeys/hmac_secret.txt
            echo "Using the HMAC_SECRET repository secret"
          else
            openssl rand -hex 32 > Tool_cfg/SigningKeys/hmac_secret.txt
            echo "::warning::HMAC_SECRET is not set - built with a throwaway key, the signed images are not for devices"
          fi

      - name: Build every variant
        env:
          CI_BUILD_SHA: ${{ github.sha }}
        run: make -C "$BUILD_DIR" all

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: |
            APP/Build/**/*.hex
            APP/Build/**/*.elf
            APP/Build/**/*.map
            BM/Build/**/*.hex
            FBL/Build/**/*.hex
          if-no-files-found: warn
          retention-days: 60

      # The software tests are built for a 32-bit host (they cast pointers to u32_t), so they need gcc -m32 everywhere: the
      # library, the tests and the coverage link. A gcc wrapper first on the PATH gives every tool that calls gcc the 32-bit one.
      # sw_test_project.yml takes SW_TEST_CC / SW_TEST_MAKE / SW_TEST_AR when TTLD (the Windows MinGW) is not set.
      - name: Prepare the 32-bit host compiler
        run: |
          sudo apt-get install -y gcc-multilib
          mkdir -p "$RUNNER_TEMP/gcc32"
          printf '#!/bin/sh\nexec /usr/bin/gcc -m32 "$@"\n' > "$RUNNER_TEMP/gcc32/gcc"
          chmod +x "$RUNNER_TEMP/gcc32/gcc"
          echo "$RUNNER_TEMP/gcc32" >> "$GITHUB_PATH"

      # HUB's tests are the software tests (APP/test/sw_tests). Its unit tests live in common_modules, which runs them.
      - name: Run software tests
        env:
          SW_TEST_CC: gcc
          SW_TEST_MAKE: make
          SW_TEST_AR: ar
        run: make -C "$BUILD_DIR" test_sw_all

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            APP/test/build/artifacts/
            APP/test/CodeCoverage/
          if-no-files-found: ignore
          retention-days: 60

      - name: Generate function documentation
        if: always()
        continue-on-error: true
        run: |
          make -C "$BUILD_DIR" doc_functions
          mkdir -p function_docs
          find APP/Src Common_Src xCOMMON_MODULES/Src -name '*_Documentation.html' -exec cp {} function_docs/ \; 2>/dev/null || true
          echo "Collected $(ls function_docs/*.html 2>/dev/null | wc -l) doc files"

      - name: Upload function documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: function-documentation-${{ github.sha }}
          path: function_docs/
          if-no-files-found: ignore
          retention-days: 60

      - name: Generate and commit badges
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p .github/badges

          # badge_creator --version-badge looks for project.yml above BuildEnv, i.e. the repo root; HUB's is in APP
          VERSION=$(cd "$BUILD_DIR" && sVersion -l --yml project.yml)
          ruby BuildEnv/xBuildEnv/bin/badge_creator sw_version "$VERSION" --value-color 007ec6 --output .github/badges/version.svg

          if [ -f APP/Build/SUPER_PILL/APP.elf ]; then
            ruby BuildEnv/xBuildEnv/bin/badge_creator build passing --value-color 44cc11 --output .github/badges/build.svg
          else
            ruby BuildEnv/xBuildEnv/bin/badge_creator build failing --value-color e05d44 --output .github/badges/build.svg
          fi

          git config --unset-all http.https://github.com/.extraheader || true
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(echo -n x-access-token:${{ github.token }} | base64)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update CI badges [skip ci]"
            git push
          else
            echo "No badge changes to commit"
          fi

  release_package:
    needs: build_and_test
    if: github.event_name == 'workflow_dispatch' && inputs.manual_release == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - uses: ./.github/actions/setup

      - name: Provide the secure boot HMAC secret
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          # A release is flashed to devices, so it is never built with a throwaway key
          if [ -z "$HMAC_SECRET" ]; then echo "::error::HMAC_SECRET is not set - refusing to release images signed with a throwaway key"; exit 1; fi
          mkdir -p Tool_cfg/SigningKeys
          printf '%s' "$HMAC_SECRET" > Tool_cfg/SigningKeys/hmac_secret.txt

      - name: Build release package
        env:
          CI_BUILD_SHA: ${{ github.sha }}
          CI_IS_RC: "true"
        run: make -C "$BUILD_DIR" release_package

      - name: Read version
        id: version
        env:
          CI_BUILD_SHA: ${{ github.sha }}
          CI_IS_RC: "true"
        run: |
          VER=$(cd "$BUILD_DIR" && sVersion -l --yml project.yml 2>/dev/null || echo "0.0.0.$(echo '${{ github.sha }}' | cut -c1-7)")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}"    >> "$GITHUB_OUTPUT"

      - name: Locate release ZIP
        id: zip
        run: |
          ZIP_PATH=$(find Release_package -name "*.zip" | head -1)
          echo "path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          ls -lh "${ZIP_PATH}"

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: release_assets/

      - name: Add release ZIP to assets
        run: cp "${{ steps.zip.outputs.path }}" release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "HUB ${{ steps.version.outputs.version }}"
          body: |
            **Branch:** `${{ github.ref_name }}` | **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'RC') }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
